<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/fonts.css">

    <title>Join</title>
</head>

<body>
    <header>

    </header>

    <main class="landing-page">
        <img class="logo-brigt" src="./assets/icons/logo_bright.svg" alt="">
        <img class="logo-dark" src="./assets/icons/logo_dark.svg" alt="">
        <section class="login">
            <h1>Log in</h1>

            <form>
                <div class="input-wrapper">
                    <input type="email" autocomplete="email" placeholder="Email">
                    <img src="./assets/icons/mail.svg" alt="">
                </div>

                <div class="input-wrapper">
                    <input type="password" id="passwortFeld" autocomplete="current-password" placeholder="Passwort eingeben">
                    <button type="button">
                        <img id="augeIcon" src="./assets/icons/show_password.svg" alt="Anzeigen">
                    </button>
                </div>

                <div class="login-button-area">
                    <button class="button-dark" type="button">
                        Log in
                    </button>
                    <button class="button-bright" type="button">
                        Guest Log in
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer>

    </footer>
</body>

</html>
