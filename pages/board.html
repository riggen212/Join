<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="shortcut icon" href="../assets/icons/logo_dark.svg" type="image/x-icon" />
        <link rel="stylesheet" href="../styles/fonts.css" />
        <link rel="stylesheet" href="../styles/board.css" />
        <link rel="stylesheet" href="../global_style.css" />
        <title>Board</title>
    </head>
    <body>
        <header class="header">
            <div class="header-wrapper">
                <img src="../assets/icons/logo_dark.svg" alt="Dark join logo" class="header-logo" />
                <button class="header-profile-initials-button">G</button>
            </div>
        </header>
        <main class="board">
            <div class="board-wrapper">
                <div class="board-headline">
                    <h1>Board</h1>
                    <button class="button button-dark button-add-task">
                        <img src="../assets/icons/add-mobile.svg" alt="Add" />
                    </button>
                </div>
                <div class="board-content">
                    <div class="board-input-wrapper">
                        <input id="search" type="search" placeholder="Find Task" />
                        <button type="button" class="button button-search">
                            <img src="../assets/icons/search.svg" alt="Search" />
                        </button>
                    </div>
                    <section>
                        <h2>To do</h2>
                    </section>
                    <section>
                        <h2>In progress</h2>
                    </section>
                    <section>
                        <h2>Await feedback</h2>
                    </section>
                    <section>
                        <h2>Done</h2>
                    </section>
                </div>
            </div>
        </main>
        <footer class="footer-navbar">
            <div class="navbar">
                <div class="navbar-wrapper">
                    <button class="button button-navbar">
                        <img src="../assets/icons/summary.svg" alt="Summary icon" />
                        <span>Summary</span>
                    </button>
                    <button class="button button-navbar">
                        <img src="../assets/icons/add_task.svg" alt="Add task icon" />
                        <span>Add Task</span>
                    </button>
                    <button class="button button-navbar">
                        <img src="../assets/icons/board.svg" alt="Board icon" />
                        <span>Board</span>
                    </button>
                    <button class="button button-navbar">
                        <img src="../assets/icons/contacts.svg" alt="Contacts icon" />
                        <span>Contacts</span>
                    </button>
                </div>
            </div>
        </footer>
    </body>
</html>
