<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <script src="../scripts/templates.js" defer></script>
        <script src="../scripts/notifications.js" defer></script>
        <script src="../script.js" defer></script>
        <script src="../scripts/board/boardTemplates.js" defer></script>
        <script src="../scripts/board/boardKeyboardUsage.js" defer></script>
        <script src="../scripts/board/boardServices.js" defer></script>
        <script src="../scripts/board/boardMovement.js" defer></script>
        <script src="../scripts/board/boardDialogs.js" defer></script>
        <script src="../scripts/board/board.js" defer></script>
        <script src="../scripts/addTask/addTaskFields.js" defer></script>
        <script src="../scripts/addTask/addTaskSubtasks.js" defer></script>
        <script src="../scripts/addTask/addTaskValidation.js" defer></script>
        <script src="../scripts/addTask/addTask.js" defer></script>

        <link rel="shortcut icon" href="../assets/icons/logoDark.svg" type="image/x-icon"/>
        <link rel="stylesheet" href="../styles/root.css">
        <link rel="stylesheet" href="../style.css"/>
        <link rel="stylesheet" href="../styles/components.css"/>
        <link rel="stylesheet" href="../styles/fonts.css"/>
        <link rel="stylesheet" href="../styles/addTask/taskForm.css"/>
        <link rel="stylesheet" href="../styles/addTask/taskControls.css"/>
        <link rel="stylesheet" href="../styles/addTask/taskSubtasks.css"/>
        <link rel="stylesheet" href="../styles/addTask/addTask.css"/>
        <link rel="stylesheet" href="../styles/board/board.css"/>
        <link rel="stylesheet" href="../styles/board/boardTask.css"/>
        <title>Join</title>
    </head>
    <body onmousedown="closeDropdownsOnOutsideClick(event)">
        <header class="header">
            <div class="header-wrapper">
                <div>
                    <img src="../assets/icons/logoDark.svg" alt="Dark join logo" class="header-logo" />
                    <p class="header-headline">Kanban Project Management Tool</p>
                </div>
                <div class="d-flex-align-center gap-lg">
                    <a href="../pages/help.html" data-nav-link class="header-link">
                        <img src="../assets/icons/help.svg" alt="Help" />
                    </a>
                    <button class="header-profile-initials-button" type="button" onclick="openDialog('dialog-profile')"
                        aria-label="Open service links and log out"
                        aria-haspopup="dialog"
                        aria-controls="dialog-profile"
                        aria-expanded="false"
                    ></button>
                </div>
            </div>

            <dialog id="dialog-profile" aria-label="Service links and log out" closedby="any" oncancel="dialogSlideOut(event, 'dialog-profile-closing')" onanimationend="closeProfileDialog(event)">
                <nav aria-label="Service links">
                    <ul>
                        <li>
                            <a id="link-help-profile-dialog" href="../pages/help.html" data-nav-link class="link-navbar" onclick="event.target.closest('dialog').close()">Help</a>
                        </li>
                        <li>
                            <a href="../pages/legalNotice.html" data-nav-link class="link-navbar" onclick="event.target.closest('dialog').close()">Legal Notice</a>
                        </li>
                        <li>
                            <a href="../pages/privacyPolicy.html" data-nav-link class="link-navbar" onclick="event.target.closest('dialog').close()" >Privacy Policy</a>
                        </li>
                        <li>
                            <a href="../index.html" class="link-navbar">Log out</a>
                        </li>
                    </ul>
                </nav>
            </dialog>
        </header>

        <div class="app-wrapper">
            <nav class="navbar" aria-label="Main navigation">
                <div class="navbar-wrapper">
                    <img class="navbar-logo" src="../assets/icons/logoBright.svg" alt="Join Logo bright" />
                    <ul class="navbar-links">
                        <li>
                            <a href="../pages/summaryPage.html" data-nav-link class="link-navbar">
                                <img src="../assets/icons/summary.svg" alt="" />
                                <span>Summary</span>
                            </a>
                        </li>

                        <li>
                            <a href="../pages/addTask.html" data-nav-link class="link-navbar">
                                <img src="../assets/icons/addTask.svg" alt="" />
                                <span>Add Task</span>
                            </a>
                        </li>

                        <li>
                            <a href="../pages/board.html" data-nav-link class="link-navbar active" aria-current="page">
                                <img src="../assets/icons/board.svg" alt="" />
                                <span>Board</span>
                            </a>
                        </li>

                        <li>
                            <a href="../pages/contacts.html" data-nav-link class="link-navbar">
                                <img src="../assets/icons/contacts.svg" alt="" />
                                <span>Contacts</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <footer>
                    <ul class="navbar-links">
                        <li>
                            <a href="../pages/privacyPolicy.html" data-nav-link class="link-navbar">
                                <span>Privacy Policy</span>
                            </a>
                        </li>

                        <li>
                            <a href="../pages/legalNotice.html" data-nav-link class="link-navbar">
                                <span>Legal notice</span>
                            </a>
                        </li>
                    </ul>
                </footer>
            </nav>

            <main class="board">
                <div class="board-inner">
                    <header id="board-header">
                        <h1>Board</h1>

                        <button class="button button-dark button-add button-add-dark-mobile" onclick="openAddTaskDialog()" aria-label="Create Task">
                            <img class="button-add-icon-mobile" src="../assets/icons/addMobileWhite.svg" alt="Add" />
                            <span class="button-add-span-desktop">Add Task</span>
                            <img class="button-add-icon-desktop" src="../assets/icons/add.svg" alt="Add" />
                        </button>

                        <div class="board-search">
                            <input id="search" class="board-search-input" type="search" oninput="searchTasks(this.value)" placeholder="Find Task" aria-label="Search tasks"/>
                            <img class="board-search-icon" src="../assets/icons/search.svg" alt="" />
                        </div>
                    </header>

                    <div id="board-content">
                        <section data-column-id="toDo" class="board-column">
                            <header class="board-column-header">
                                <h2>To do</h2>

                                <button class="button button-bright button-add button-add-bright-mobile" onclick="openAddTaskDialog(this.closest('section').dataset.columnId)" aria-label="Create task in To do">
                                    <img src="../assets/icons/addMobileBlue.svg" alt="Add" />
                                </button>

                            </header>

                            <div id="toDo-content" class="board-column-content"
                                ondragover="(allowDrop(event), addHighlightDroppableColumn(this.parentElement.dataset.columnId))"
                                ondragleave="handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event)"
                                ondrop="(moveTask(this.parentElement.dataset.columnId), handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event))">
                            </div>
                        </section>

                        <section data-column-id="inProgress" class="board-column">
                            <header class="board-column-header">
                                <h2>In progress</h2>

                                <button class="button button-bright button-add button-add-bright-mobile" onclick="openAddTaskDialog(this.closest('section').dataset.columnId)" aria-label="Create task in In progress">
                                    <img src="../assets/icons/addMobileBlue.svg" alt="Add" />
                                </button>
                            </header>

                            <div id="inProgress-content" class="board-column-content"
                                ondragover="(allowDrop(event), addHighlightDroppableColumn(this.parentElement.dataset.columnId))"
                                ondragleave="handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event)"
                                ondrop="(moveTask(this.parentElement.dataset.columnId), handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event))">
                            </div>
                        </section>

                        <section data-column-id="awaitFeedback" class="board-column">
                            <header class="board-column-header">
                                <h2>Await feedback</h2>

                                <button class="button button-bright button-add button-add-bright-mobile" onclick="openAddTaskDialog(this.closest('section').dataset.columnId)" aria-label="Create task in Await feedback">
                                    <img src="../assets/icons/addMobileBlue.svg" alt="Add" />
                                </button>
                            </header>

                            <div id="awaitFeedback-content" class="board-column-content" 
                                ondragover="(allowDrop(event), addHighlightDroppableColumn(this.parentElement.dataset.columnId))"
                                ondragleave="handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event)"
                                ondrop="(moveTask(this.parentElement.dataset.columnId), handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event))">
                            </div>
                        </section>

                        <section data-column-id="done" class="board-column">
                            <header class="board-column-header">
                                <h2>Done</h2>
                            </header>

                            <div id="done-content" class="board-column-content"
                                ondragover=" (allowDrop(event), addHighlightDroppableColumn(this.parentElement.dataset.columnId))"
                                ondragleave="handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event)"
                                ondrop="(moveTask(this.parentElement.dataset.columnId), handleColumnDragLeaveOrDrop(this.parentElement.dataset.columnId, event))">
                            </div>
                        </section>
                    </div>
                </div>

                <dialog id="dialog-task" aria-labelledby="task-dialog-title" data-task-id="" data-task-status="" closedby="any" oncancel="dialogSlideOut(event, 'dialog-task-closing')"onanimationend="closeTaskDialog(event)">
                </dialog>
                
                <dialog id="dialog-add-task" closedby="any" oncancel="dialogSlideOut(event, 'dialog-task-closing')" onanimationend="closeTaskDialog(event)">
                </dialog>
            </main>
        </div>
    </body>
</html>
