<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../assets/icons/logo_dark.svg">
    
    <link rel="stylesheet" href="../global_style.css">
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/sign_up.css">
    <link rel="stylesheet" href="../styles/fonts.css">

    <title>Join</title>
</head>

<body class="sign-up-page">
    <header>
    </header>
    <main>
        <div class="landing-page-content">
            <img class="logo-bright" src="../assets/icons/logo_bright.svg" alt="">
            <img class="logo-dark" src="../assets/icons/logo_dark.svg" alt="">
            <section class="main-wrapper">
                <div class="sign-up-headline">
                    <button type="button" class="button back-to-login">
                        <a href="../index.html#login">
                            <img src="../assets/icons/arrow.svg" alt="back to the login page">
                        </a>
                    </button>
                    <h1>Sign up</h1>
                </div>

                <form>
                    <div class="input-wrapper">
                        <input type="email" autocomplete="email" placeholder="Name" required>
                        <span class="input-icon">
                            <img src="../assets/icons/person.svg" alt="">
                        </span>
                    </div>

                    <div class="input-wrapper">
                        <input type="email" autocomplete="email" placeholder="Email" required>
                        <span class="input-icon">
                            <img src="../assets/icons/mail.svg" alt="">
                        </span>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="passwortFeld" autocomplete="current-password" placeholder="Password"
                            required>
                        <button type="button">
                            <img id="augeIcon" src="../assets/icons/show_password.svg" alt="show password">
                        </button>
                    </div>

                    <div class="input-wrapper">
                        <input type="password" id="passwortFeld" autocomplete="current-password" placeholder="Confirm Password" required>
                        <button type="button">
                            <img id="augeIcon" src="../assets/icons/show_password.svg" alt="show the password">
                        </button>
                    </div>

                    <div class="sign-up-button-area">
                        <div>
                            <input type="checkbox" name="accept_policy" id="">
                            <label for="accept_policy">I accept the
                                <a href="../pages/privacy_policy.html" target="_blank">Privacy Policy</a>
                            </label>
                        </div>
                        <button class="button button-dark" type="button">
                            Sign up
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <footer>
        <a href="../pages/privacy_policy.html">Privacy Policy</a>
        <a href="../pages/legal_notice.html">Legal notice</a>
    </footer>
</body>

</html>
