<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="../script.js" defer></script>
    <link rel="shortcut icon" href="../assets/icons/logo_dark.svg" type="image/x-icon" />

    <link rel="stylesheet" href="../global_style.css" />
    <link rel="stylesheet" href="../styles/components.css">
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/add_task.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/board.css" />

    <title>Join</title>
</head>

<body>
    <header class="header">
        <div class="header-wrapper">
            <div>
                <img src="../assets/icons/logo_dark.svg" alt="Dark join logo" class="header-logo" />
                <p class="header-headline">Kanban Project Management Tool</p>
            </div>
            <div class="d-flex-align-center gap-lg">
                <a href="../pages/help.html" class="header-link">
                    <img src="../assets/icons/help.svg" alt="Help" />
                </a>
                <button class="header-profile-initials-button" onclick="openDialog('dialog-profile')">G</button>
            </div>
        </div>
        <dialog id="dialog-profile" closedby="any" oncancel="dialogSlideOut(event, 'dialog-profile-closing')"
            onanimationend="closeProfileDialog(event)">
            <nav>
                <ul>
                    <li>
                        <a id="link-help-profile-dialog" href="../pages/help.html" class="link-navbar"
                            onclick="event.target.closest('dialog').close()">Help</a>
                    </li>
                    <li>
                        <a href="../pages/legal_notice.html" class="link-navbar"
                            onclick="event.target.closest('dialog').close()">Legal Notice</a>
                    </li>
                    <li>
                        <a href="../pages/privacy_policy.html" class="link-navbar"
                            onclick="event.target.closest('dialog').close()">Privacy Policy</a>
                    </li>
                    <li>
                        <a href="../index.html" class="link-navbar">Log out</a>
                    </li>
                </ul>
            </nav>
        </dialog>
    </header>

    <div class="app-wrapper">
        <nav class="navbar">
            <div class="navbar-wrapper">
                <img class="navbar-logo" src="../assets/icons/logo_bright.svg" alt="Join Logo bright" />
                <ul class="navbar-links">
                    <li>
                        <a href="../pages/summary_page.html" class="link-navbar">
                            <img src="../assets/icons/summary.svg" alt="Summary icon" />
                            <span>Summary</span>
                        </a>
                    </li>
                    <li>
                        <a href="../pages/add_task.html" class="link-navbar active">
                            <img src="../assets/icons/add_task.svg" alt="Add task icon" />
                            <span>Add Task</span>
                        </a>
                    </li>
                    <li>
                        <a href="../pages/board.html" class="link-navbar">
                            <img src="../assets/icons/board.svg" alt="Board icon" />
                            <span>Board</span>
                        </a>
                    </li>
                    <li>
                        <a href="../pages/contacts.html" class="link-navbar">
                            <img src="../assets/icons/contacts.svg" alt="Contacts icon" />
                            <span>Contacts</span>
                        </a>
                    </li>
                </ul>
            </div>
            <footer>
                <ul class="navbar-links">
                    <li>
                        <a href="../pages/privacy_policy.html" class="link-navbar">
                            <span>Privacy Policy</span>
                        </a>
                    </li>
                    <li>
                        <a href="../pages/legal_notice.html" class="link-navbar">
                            <span>Legal notice</span>
                        </a>
                    </li>
                </ul>
            </footer>
        </nav>
        <main class="board add-task-page">
            <div class="board-inner add-task-inner">
                <h1>Add Task</h1>
                <section class="add-task">
                    <form class="task-form-wrapper">
                        <div class="add-task-form">
                            <!-- Left column -->
                            <div class="task-form">
                                <label for="task-title"> Title<span class="required">*</span> </label>
                                <input class="input-wrapper" id="task-title" name="title" type="text"
                                    placeholder="Enter a title" required />

                                <label for="task-description"> Description </label>
                                <textarea class="input-wrapper" id="task-description" name="description"
                                    placeholder="Enter a Description"></textarea>

                                <label for="task-due-date"> Due date<span class="required">*</span> </label>
                                <input class="input-wrapper no-flex input-date" id="task-due-date" name="dueDate"
                                    type="date" required />
                            </div>

                            <!-- Right column -->
                            <div class="task-form">
                                <span>Priority</span>

                                <div class="task-priority">
                                    <div>
                                        <button class="button" type="button">
                                            Urgent
                                            <img src="../assets/icons/priority_arrows_up.svg" alt="" />
                                        </button>
                                    </div>

                                    <div>
                                        <button class="button medium" type="button">
                                            Medium
                                            <img src="../assets/icons/priority_equal.svg" alt="" />
                                        </button>
                                    </div>

                                    <div>
                                        <button class="button" type="button">
                                            Low
                                            <img src="../assets/icons/priority_arrows_down.svg" alt="" />
                                        </button>
                                    </div>
                                </div>

                                <fieldset class="assigned-dropdown">
                                    <legend>Assigned to</legend>

                                    <div class="input-wrapper">
                                        <input type="search" id="task-assigned" placeholder="Select contacts to assign"
                                            aria-label="Search contacts">
                                        <img src="../assets/icons/arrow_drop_down.svg" alt="">
                                    </div>

                                    <!-- Preview data: JavaScript will create these entries from the contacts JSON. -->
                                    <ul class="assigned-options" id="assigned-options">
                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-blue-light">SM</span>
                                                <span>Sofia Müller(You)</span>
                                                <input type="checkbox" name="assignedTo" value="user">
                                            </label>
                                        </li>

                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-orange">AM</span>
                                                <span>Anton Mayer</span>
                                                <input type="checkbox" name="assignedTo" value="contact1">
                                            </label>
                                        </li>

                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-purple">AS</span>
                                                <span>Anja Schulz</span>
                                                <input type="checkbox" name="assignedTo" value="contact2" checked>
                                            </label>
                                        </li>

                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-blue-medium">BZ</span>
                                                <span>Benedikt Ziegler</span>
                                                <input type="checkbox" name="assignedTo" value="contact3">
                                            </label>
                                        </li>

                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-pink">DE</span>
                                                <span>David Eisenberg</span>
                                                <input type="checkbox" name="assignedTo" value="contact4" checked>
                                            </label>
                                        </li>
                                        <li>
                                            <label class="assigned-option">
                                                <span class="badge-user badge-user-yellow">EF</span>
                                                <span>Eva Fischer</span>
                                                <input type="checkbox" name="assignedTo" value="contact5" checked>
                                            </label>
                                        </li>
                                    </ul>

                                    <!-- Preview badges: JavaScript will create these from the selected contact IDs. -->
                                    <ul class="assigned-badges" id="assigned-badges" aria-label="Selected contacts">
                                        <li class="badge-user badge-user-purple">AS</li>
                                        <li class="badge-user badge-user-pink">DE</li>
                                        <li class="badge-user badge-user-yellow">EF</li>
                                    </ul>
                                </fieldset>

                                <fieldset class="category-field" id="task-category">
                                    <legend>Category<span class="required">*</span></legend>

                                    <button class="input-wrapper" type="button">
                                        <span>Select task category</span>
                                        <img src="../assets/icons/arrow_drop_down.svg" alt="">
                                    </button>

                                    <ul class="category-options">
                                        <li>
                                            <label>
                                                <input type="radio" name="category" value="Technical Task" required>
                                                Technical Task
                                            </label>
                                        </li>
                                        <li>
                                            <label>
                                                <input type="radio" name="category" value="User Story" required>
                                                User Story
                                            </label>
                                        </li>
                                    </ul>
                                </fieldset>

                                <label for="subtask"> Subtasks </label>

                                <input class="input-wrapper" id="subtask" name="subtask" type="text"
                                    placeholder="Add new subtask" />
                            </div>
                        </div>

                        <div class="submit-task">
                            <p>
                                <span class="required">*</span>
                                This field is required
                            </p>

                            <div class="submit-task-send">
                                <button class="button button-bright" type="reset">
                                    <span>Clear</span>
                                    <img src="../assets/icons/cancel.svg" alt="">
                                </button>

                                <button class="button button-dark" type="submit">
                                    <span>Create Task</span>
                                    <img src="../assets/icons/check.svg" alt="">
                                </button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
