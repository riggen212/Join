<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="../script.js" defer></script>
    <script src="../scripts/notifications.js" defer></script>
    <script src="../scripts/formErrors.js" defer></script>
    <script src="../scripts/contacts/contactsValidation.js" defer></script>
    <script src="../scripts/contacts/contactData.js" defer></script>
    <script src="../scripts/signUp/signUpValidation.js" defer></script>
    <script src="../scripts/signUp/signUp.js" defer></script>
    <link rel="icon" type="image/x-icon" href="../assets/icons/logoDark.svg" />

    <link rel="stylesheet" href="../styles/root.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/components/components.css" />
    <link rel="stylesheet" href="../styles/components/forms.css" />
    <link rel="stylesheet" href="../styles/components/dialogs.css" />
    <link rel="stylesheet" href="../styles/formErrors.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/authIntermediate.css" />
    <link rel="stylesheet" href="../styles/signUp.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />

    <title>Join</title>
  </head>

  <body class="sign-up-page">
    <main>
      <div class="landing-page-content">
        <img class="logo-bright" src="../assets/icons/logoBright.svg" alt="" />
        <img class="logo-dark" src="../assets/icons/logoDark.svg" alt="" />
        <section class="main-wrapper">
          <div class="sign-up-headline">
            <a href="../index.html#login" class="button-close back-to-login" aria-label="Back to login">
              <img src="../assets/icons/arrow.svg" alt="" />
            </a>
            <h1>Sign up</h1>
          </div>

          <form
            id="signUpForm"
            novalidate
            onsubmit="signUp(event)"
            oninput="updateSignUpButton()"
            onchange="updateSignUpButton()"
          >
            <div class="form-field">
              <div class="input-wrapper">
                <input
                  type="text"
                  id="nameField"
                  maxlength="100"
                  aria-label="Name"
                  autocomplete="name"
                  placeholder="Name"
                  aria-describedby="signup-name-error"
                  oninput="handleSignUpFieldValidation(this)"
                  onblur="handleSignUpFieldValidation(this, true)"
                />
                <span class="input-icon">
                  <img src="../assets/icons/person.svg" alt="" />
                </span>
              </div>
              <p id="signup-name-error" class="form-field-error" data-error-for="nameField" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <div class="input-wrapper">
                <input
                  type="email"
                  id="emailField"
                  maxlength="254"
                  aria-label="Email"
                  autocomplete="email"
                  placeholder="Email"
                  aria-describedby="signup-email-error"
                  oninput="handleSignUpFieldValidation(this)"
                  onblur="handleSignUpFieldValidation(this, true)"
                />
                <span class="input-icon">
                  <img src="../assets/icons/mail.svg" alt="" />
                </span>
              </div>
              <p id="signup-email-error" class="form-field-error" data-error-for="emailField" aria-live="polite"></p>
            </div>

            <div class="form-field">
              <div class="input-wrapper">
                <input
                  type="password"
                  id="passwordField"
                  aria-label="Password"
                  autocomplete="new-password"
                  placeholder="Password"
                  aria-describedby="signup-password-error"
                  oninput="
                    updateSignUpPasswordIcon('passwordField', 'passwordEyeIcon');
                    handleSignUpFieldValidation(this);
                  "
                  onblur="handleSignUpFieldValidation(this, true)"
                />

                <button
                  type="button"
                  disabled
                  onclick="toggleSignUpPassword('passwordField', 'passwordEyeIcon')"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <img id="passwordEyeIcon" src="../assets/icons/showPassword.svg" alt="" />
                </button>
              </div>

              <p
                id="signup-password-error"
                class="form-field-error"
                data-error-for="passwordField"
                aria-live="polite"
              ></p>
            </div>

            <div class="form-field">
              <div class="input-wrapper">
                <input
                  type="password"
                  id="confirmPasswordField"
                  aria-label="Confirm Password"
                  autocomplete="new-password"
                  placeholder="Confirm Password"
                  aria-describedby="signup-confirm-password-error"
                  oninput="
                    updateSignUpPasswordIcon('confirmPasswordField', 'confirmPasswordEyeIcon');
                    handleSignUpFieldValidation(this);
                  "
                  onblur="handleSignUpFieldValidation(this, true)"
                />

                <button
                  type="button"
                  disabled
                  onclick="toggleSignUpPassword('confirmPasswordField', 'confirmPasswordEyeIcon')"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <img id="confirmPasswordEyeIcon" src="../assets/icons/showPassword.svg" alt="" />
                </button>
              </div>

              <p
                id="signup-confirm-password-error"
                class="form-field-error"
                data-error-for="confirmPasswordField"
                aria-live="polite"
              ></p>
            </div>

            <div class="sign-up-button-area">
              <div class="form-field">
                <div class="d-flex-align-center gap-xxs">
                  <input
                    type="checkbox"
                    name="accept_policy"
                    id="acceptPolicy"
                    aria-describedby="signup-policy-error"
                    onchange="handleSignUpFieldValidation(this, true)"
                  />
                  <label for="acceptPolicy">
                    I accept the
                    <a
                      href="../pages/privacyPolicy.html"
                      target="_blank"
                      aria-label="Privacy Policy (opens in a new tab)"
                    >
                      Privacy Policy
                    </a>
                  </label>
                </div>

                <p
                  id="signup-policy-error"
                  class="form-field-error"
                  data-error-for="acceptPolicy"
                  aria-live="polite"
                ></p>
              </div>
              <div class="form-field">
                <p class="form-error" data-form-error role="alert"></p>

                <button class="button button-dark" type="submit" id="signUpButton" disabled>Sign up</button>
              </div>
            </div>
          </form>
          <p id="sign-up-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></p>
        </section>
      </div>
    </main>
    <footer>
      <a href="../pages/privacyPolicy.html">Privacy Policy</a>
      <a href="../pages/legalNotice.html">Legal notice</a>
    </footer>
  </body>
</html>
