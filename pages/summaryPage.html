<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="../script.js" defer></script>
    <script src="../scripts/notifications.js" defer></script>
    <script src="../scripts/summaryPage.js" defer></script>

    <link rel="shortcut icon" href="../assets/icons/logoDark.svg" type="image/x-icon" />
    <link rel="stylesheet" href="../styles/root.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/components/components.css" />
    <link rel="stylesheet" href="../styles/components/forms.css" />
    <link rel="stylesheet" href="../styles/components/dialogs.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/summaryPage/summaryPage.css" />
    <link rel="stylesheet" href="../styles/summaryPage/summaryPageDesktop.css" />
    <link rel="stylesheet" href="../styles/summaryPage/summaryPageIntermediate.css" />
    <title>Summary</title>
  </head>

  <body onpageshow="checkLoginStateOnPageShow(event)">
    <header class="header">
      <div class="header-wrapper d-flex-between">
        <div>
          <img src="../assets/icons/logoDark.svg" alt="Dark join logo" class="header-logo" />
          <p class="header-headline">Kanban Project Management Tool</p>
        </div>
        <div class="d-flex-align-center gap-lg">
          <a href="../pages/help.html" data-nav-link class="header-link">
            <img src="../assets/icons/help.svg" alt="Help" />
          </a>
          <button
            class="header-profile-initials-button"
            type="button"
            popovertarget="profile-popover"
            aria-label="Open service links and log out"
            aria-controls="profile-popover"
          ></button>
        </div>
      </div>
      <div
        id="profile-popover"
        class="menu-popover menu-popover--dark menu-popover--animated profile-popover"
        aria-label="Service links and log out"
        popover="auto"
      >
        <nav aria-label="Service links">
          <ul>
            <li>
              <a
                id="link-help-profile-popover"
                href="../pages/help.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('[popover]').hidePopover()"
                >Help</a
              >
            </li>
            <li>
              <a
                href="../pages/legalNotice.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('[popover]').hidePopover()"
                >Legal Notice</a
              >
            </li>
            <li>
              <a
                href="../pages/privacyPolicy.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('[popover]').hidePopover()"
                >Privacy Policy</a
              >
            </li>
            <li>
              <a
                href="../index.html"
                class="link-navbar"
                onclick="(event.target.closest('[popover]').hidePopover(), sessionStorage.clear())"
                >Log out</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="app-wrapper">
      <nav class="navbar" aria-label="Main navigation">
        <img class="navbar-logo" src="../assets/icons/logoBright.svg" alt="Join Logo" />
        <div class="navbar-scroll scrollbar" data-background-scroll>
          <div class="navbar-wrapper">
            <ul class="navbar-links">
              <li>
                <a href="../pages/summaryPage.html" data-nav-link class="link-navbar active" aria-current="page">
                  <img src="../assets/icons/summary.svg" alt="" />
                  <span>Summary</span>
                </a>
              </li>
              <li>
                <a href="../pages/addTask.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/addTask.svg" alt="" />
                  <span>Add Task</span>
                </a>
              </li>
              <li>
                <a href="../pages/board.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/board.svg" alt="" />
                  <span>Board</span>
                </a>
              </li>
              <li>
                <a href="../pages/contacts.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/contacts.svg" alt="" />
                  <span>Contacts</span>
                </a>
              </li>
            </ul>
          </div>
          <footer>
            <ul class="navbar-links">
              <li>
                <a href="../pages/privacyPolicy.html" data-nav-link class="link-navbar">
                  <span>Privacy Policy</span>
                </a>
              </li>
              <li>
                <a href="../pages/legalNotice.html" data-nav-link class="link-navbar">
                  <span>Legal notice</span>
                </a>
              </li>
            </ul>
          </footer>
        </div>
      </nav>

      <main class="main scrollbar" data-background-scroll>
        <div class="headline-container" id="login-animation-on">
          <h1 class="headline-strong2">Join 360</h1>

          <p class="headline-span">Key Metrics at a Glance</p>
        </div>
        <div class="desktop-wrapper">
          <div class="headline-h2" id="login-animation-out">
            <p id="greeting"></p>
            <span class="headline-strong" id="userNames"></span>
          </div>
          <div class="section-container">
            <div class="section-inner">
              <a href="../pages/board.html" data-nav-link class="flexbox-container-left">
                <div class="flexbox">
                  <img class="section-img" src="../assets/icons/pencel.svg" alt="" />
                  <div class="flexbox-inner">
                    <span class="section-headline" data-summary="toDo"></span>
                    <span class="section-span">To-do</span>
                  </div>
                </div>
              </a>
              <a href="../pages/board.html" data-nav-link class="flexbox-container-right">
                <div class="flexbox">
                  <img class="section-img-right" src="../assets/icons/checkButton.svg" alt="" />
                  <div class="flexbox-inner">
                    <span class="section-headline" data-summary="done"></span>
                    <span class="section-span">Done</span>
                  </div>
                </div>
              </a>
            </div>
            <a href="../pages/board.html" data-nav-link class="deadline-container">
              <div class="deadline-inner">
                <img class="deadline-img" src="../assets/icons/deadline.svg" alt="" />
                <div class="flexbox-inner">
                  <span class="section-headline" data-summary="urgent"></span>
                  <span class="section-span">Urgent</span>
                </div>
                <div class="deadline-hr" aria-hidden="true"></div>
                <div class="flexbox-deadline">
                  <time class="deadline-date" data-summary="upcomingDeadline" datetime></time>
                  <span id="summary-deadline-description" class="visually-hidden"></span>
                  <span class="section-span">Upcoming Deadline</span>
                </div>
              </div>
            </a>
            <div class="section-inner">
              <a href="../pages/board.html" data-nav-link class="task-container task-container-left">
                <div class="taks-inner">
                  <span class="section-headline" data-summary="board"></span>
                  <span class="section-span">Tasks in<br />Board</span>
                </div>
              </a>
              <a href="../pages/board.html" data-nav-link class="task-container task-container-middle">
                <div class="taks-inner">
                  <span class="section-headline" data-summary="inProgress"></span>
                  <span class="section-span">Tasks in<br />Progress</span>
                </div>
              </a>
              <a href="../pages/board.html" data-nav-link class="task-container task-container-right">
                <div class="taks-inner">
                  <span class="section-headline" data-summary="awaitFeedback"></span>
                  <span class="section-span">Awaiting<br />feedback</span>
                </div>
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
