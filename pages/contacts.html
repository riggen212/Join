<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="../scripts/contacts/contactsTemplates.js" defer></script>
    <script src="../scripts/notifications.js" defer></script>
    <script src="../script.js" defer></script>
    <script src="../scripts/contacts/contactData.js" defer></script>
    <script src="../scripts/contacts/contactsValidation.js" defer></script>
    <script src="../scripts/contacts/contactsDetails.js" defer></script>
    <script src="../scripts/contacts/contacts.js" defer></script>

    <link rel="shortcut icon" href="../assets/icons/logoDark.svg" type="image/x-icon" />

    <link rel="stylesheet" href="../styles/root.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/utilities.css" />
    <link rel="stylesheet" href="../styles/components/components.css" />
    <link rel="stylesheet" href="../styles/components/forms.css" />
    <link rel="stylesheet" href="../styles/components/dialogs.css" />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="stylesheet" href="../styles/addTask/addTask.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/board/board.css" />
    <link rel="stylesheet" href="../styles/contacts/contacts.css" />
    <link rel="stylesheet" href="../styles/contacts/contactsDetails.css" />
    <link rel="stylesheet" href="../styles/contacts/addContact.css" />

    <title>Join</title>
  </head>

  <body onpageshow="checkLoginStateOnPageShow(event)">
    <header class="header">
      <div class="header-wrapper d-flex-between">
        <div>
          <img src="../assets/icons/logoDark.svg" alt="Dark join logo" class="header-logo" />
          <p class="header-headline">Kanban Project Management Tool</p>
        </div>
        <div class="d-flex-align-center gap-lg">
          <a href="../pages/help.html" data-nav-link class="header-link">
            <img src="../assets/icons/help.svg" alt="Help" />
          </a>

          <button
            class="header-profile-initials-button"
            aria-controls="dialog-profile"
            aria-expanded="false"
            aria-label="Open service links and log out"
            aria-haspopup="dialog"
            onclick="openDialog('dialog-profile')"
          ></button>
        </div>
      </div>

      <dialog
        id="dialog-profile"
        aria-label="Service links and log out"
        closedby="any"
        oncancel="dialogSlideOut(event, 'dialog-profile-closing')"
        onanimationend="closeProfileDialog(event)"
      >
        <nav aria-label="Service links">
          <ul>
            <li>
              <a
                id="link-help-profile-dialog"
                href="../pages/help.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('dialog').close()"
                >Help</a
              >
            </li>
            <li>
              <a
                href="../pages/legalNotice.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('dialog').close()"
                >Legal Notice</a
              >
            </li>
            <li>
              <a
                href="../pages/privacyPolicy.html"
                data-nav-link
                class="link-navbar"
                onclick="event.target.closest('dialog').close()"
                >Privacy Policy</a
              >
            </li>
            <li>
              <a
                href="../index.html"
                class="link-navbar"
                onclick="(event.target.closest('dialog').close(), sessionStorage.clear())"
                >Log out</a
              >
            </li>
          </ul>
        </nav>
      </dialog>
    </header>

    <div id="content" class="app-wrapper">
      <nav class="navbar" aria-label="Main navigation">
        <img class="navbar-logo" src="../assets/icons/logoBright.svg" alt="Join Logo bright" />
        <div class="navbar-scroll scrollbar" data-background-scroll>
          <div class="navbar-wrapper">
            <ul class="navbar-links">
              <li>
                <a href="../pages/summaryPage.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/summary.svg" alt="" />
                  <span>Summary</span>
                </a>
              </li>
              <li>
                <a href="../pages/addTask.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/addTask.svg" alt="" />
                  <span>Add Task</span>
                </a>
              </li>
              <li>
                <a href="../pages/board.html" data-nav-link class="link-navbar">
                  <img src="../assets/icons/board.svg" alt="" />
                  <span>Board</span>
                </a>
              </li>
              <li>
                <a href="../pages/contacts.html" data-nav-link class="link-navbar active" aria-current="page">
                  <img src="../assets/icons/contacts.svg" alt="" />
                  <span>Contacts</span>
                </a>
              </li>
            </ul>
          </div>
          <footer>
            <ul class="navbar-links">
              <li>
                <a href="../pages/privacyPolicy.html" data-nav-link class="link-navbar">
                  <span>Privacy Policy</span>
                </a>
              </li>
              <li>
                <a href="../pages/legalNotice.html" data-nav-link class="link-navbar">
                  <span>Legal notice</span>
                </a>
              </li>
            </ul>
          </footer>
        </div>
      </nav>
      <main class="board" data-background-scroll>
        <div class="contacts-content">
          <div class="contact-list scrollbar" data-background-scroll>
            <button
              id="addNewContactButton"
              class="button button-dark detail-view"
              type="button"
              onclick="addNewContact()"
            >
              <span>Add new contact</span>
              <img src="../assets/icons/personAdd.svg" alt="" />
            </button>

            <div id="contact-groups"></div>
          </div>

          <section id="show-details" class="contact-details scrollbar" data-background-scroll onclick="hideContactActions()">
            <header>
              <div>
                <h2>Contacts</h2>
                <span>Better with a team</span>
              </div>

              <button class="button button-close" onclick="hideContactDetails()" aria-label="Back to contact list">
                <img src="../assets/icons/arrow.svg" alt="" />
              </button>
            </header>

            <section id="contact-details-info" class="contact-details-info"></section>

            <button
              id="pointMenu"
              class="button button-dark contact-add detail-view"
              type="button"
              onclick="
                event.stopPropagation();
                openDialog('dialog-edit-contact');
              "
              aria-label="Open contact actions"
              aria-controls="dialog-edit-contact"
              aria-expanded="false"
              aria-haspopup="dialog"
            >
              &#8942;
            </button>

            <dialog
              id="dialog-edit-contact"
              aria-label="Contact actions"
              closedby="any"
              oncancel="dialogSlideOut(event, 'dialog-profile-closing')"
              onanimationend="closeProfileDialog(event, this.id)"
            >
              <ul>
                <li>
                  <button class="button button-task-overlay" onclick="editContact()">
                    <img src="../assets/icons/edit.svg" alt="" />
                    <span>Edit</span>
                  </button>
                </li>
                <li>
                  <button class="button button-task-overlay" onclick="deleteContact()">
                    <img src="../assets/icons/delete.svg" alt="" />
                    <span>Delete</span>
                  </button>
                </li>
              </ul>
            </dialog>
          </section>
        </div>
      </main>
    </div>

    <dialog
      id="contact"
      closedby="any"
      oncancel="dialogSlideOut(event, 'contact-closing')"
      onanimationend="closeContactDialog(event)"
      aria-labelledby="contact-dialog-title"
    ></dialog>
  </body>
</html>
